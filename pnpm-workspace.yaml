# Pin explícito (bug pnpm #12337): sem ele, install sem CI grava state sem a
# chave e qualquer `pnpm run` com CI=true ("verifyDepsBeforeRun") entende que
# a config mudou e reinstala tudo do zero — loop que quebra o container `app`
# (build sem CI vs compose com CI=true).
enableGlobalVirtualStore: false
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true

# Correções de segurança em dependências transitivas (#120) — todas dentro da
# mesma major do que o pai pede. Tirar cada linha quando o pai subir sozinho.
overrides:
  fast-uri: ^3.1.6
  hono: ^4.13.5
  js-yaml: ^4.3.2
  postcss: ^8.5.23
  qs: ^6.16.0
  sharp: ^0.35.4
