allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true

# Correções de segurança em dependências transitivas (#120) — todas dentro da
# mesma major do que o pai pede. Tirar cada linha quando o pai subir sozinho.
overrides:
  fast-uri: ^3.1.6
  hono: ^4.13.5
  js-yaml: ^4.3.2
  postcss: ^8.5.23
  qs: ^6.16.0
  sharp: ^0.35.4
