# Bumps automáticos semanais (#120). Transitivos com correção fora do range do
# pai ficam em pnpm-workspace.yaml (overrides) — ver docs/05-ci-cd-deploy.md.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    target-branch: develop
    open-pull-requests-limit: 5
    groups:
      minor-e-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    target-branch: develop
