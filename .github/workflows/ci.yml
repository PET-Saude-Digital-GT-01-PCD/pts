name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pts
          POSTGRES_PASSWORD: pts
          POSTGRES_DB: pts
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pts -d pts"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://pts:pts@localhost:5432/pts?schema=public
      DIRECT_URL: postgresql://pts:pts@localhost:5432/pts?schema=public
      AUTH_SECRET: ci-only-secret-not-for-production
      AUTH_URL: http://localhost:3000
      SEED_ADMIN_SENHA: admin123
      SEED_DEMO: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Scan de vulnerabilidades (#121). Bloqueia só crítico em dependência de
      # runtime (--prod): é o caso do CVE do next corrigido no PR #124, e o time
      # consegue agir nele com bump direto. High/moderate costumam ser
      # transitivos fora do nosso controle: só reportam, e o bump vem pelo
      # Dependabot (.github/dependabot.yml, #120).
      - name: Audit (bloqueante — crítico em runtime)
        run: pnpm audit --prod --audit-level=critical

      - name: Audit (relatório — high+, inclui dev)
        run: pnpm audit --audit-level=high
        continue-on-error: true

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Prisma generate + migrate + seed
        run: |
          pnpm prisma generate
          pnpm db:deploy
          pnpm db:seed

      - name: Test (Vitest)
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E (Playwright)
        run: pnpm e2e
