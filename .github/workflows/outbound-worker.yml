name: outbound-worker

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: outbound-worker-production
  cancel-in-progress: false

jobs:
  processar-fila:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      WORKER_URL: ${{ secrets.OUTBOUND_WORKER_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Validar configuração
        shell: bash
        run: |
          if [[ -z "$WORKER_URL" || -z "$CRON_SECRET" ]]; then
            echo "::error::Configure os secrets OUTBOUND_WORKER_URL e CRON_SECRET."
            exit 1
          fi
          case "$WORKER_URL" in
            https://*) ;;
            *) echo "::error::OUTBOUND_WORKER_URL precisa usar HTTPS."; exit 1 ;;
          esac

      - name: Processar lote da fila
        shell: bash
        run: |
          set -euo pipefail
          response_file="$RUNNER_TEMP/outbound-worker-response.json"
          status="$(curl --silent --show-error --max-time 70 --output "$response_file" --write-out "%{http_code}" --header "Authorization: Bearer ${CRON_SECRET}" "$WORKER_URL")"
          if [[ "$status" -lt 200 || "$status" -ge 300 ]]; then
            echo "::error::Worker respondeu HTTP $status."
            exit 1
          fi
          cat "$response_file"
